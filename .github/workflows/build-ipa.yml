name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch ExpoModulesJSI Swift 6.2 Interop
        run: |
          HEADER="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          if [ -f "$HEADER" ]; then
            echo "Patching $HEADER..."
            sed -i '' 's/SWIFT_RETURNS_RETAINED //g' "$HEADER"
          fi

      - name: Expo Prebuild (iOS, clean)
        env:
          RCT_NEW_ARCH_ENABLED: 0
          EXPO_USE_NEW_ARCH: 0
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios/

      - name: Force Resolve Swift Package Dependencies
        run: |
          mkdir -p build/SourcePackages
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          echo "Resolving packages for: $WORKSPACE"
          xcodebuild \
            -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme Tally \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build unsigned IPA with Widget (Archive)
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          echo "Using workspace: $WORKSPACE"
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme Tally \
            -configuration Release \
            -archivePath build/Tally.xcarchive \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log | xcbeautify || {
              echo "=== BUILD FAILED - FULL ERROR DETAILS ==="
              grep -A 30 -E "error:|fatal error:|BUILD FAILED" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Tally.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app in archive at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            # Fallback to DerivedData if archive path differs
            APP_PATH=$(find build -name "*.app" | head -n 1)
            echo "Fallback app path: $APP_PATH"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in build output"
            exit 1
          fi

          echo "=== App PlugIns Contents ==="
          ls -la "$APP_PATH/PlugIns" || echo "No PlugIns directory"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r tally.ipa Payload/
          echo "IPA packaged successfully from archive"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tally-ipa
          path: tally.ipa
          retention-days: 14
