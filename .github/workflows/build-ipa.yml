name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS, clean)
        env:
          RCT_NEW_ARCH_ENABLED: 0
          EXPO_USE_NEW_ARCH: 0
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios/

      - name: Force Resolve Swift Package Dependencies
        run: |
          mkdir -p build/SourcePackages
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          echo "Resolving packages for: $WORKSPACE"
          xcodebuild \
            -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme Tally \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build unsigned IPA with Widget
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          echo "Using workspace: $WORKSPACE"
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme Tally \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log | xcbeautify || {
              echo "=== BUILD FAILED - FULL ERROR DETAILS ==="
              grep -A 30 -E "error:|fatal error:|BUILD FAILED" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in build output"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r tally.ipa Payload/
          echo "IPA packaged successfully with widget included"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tally-ipa
          path: tally.ipa
          retention-days: 14
