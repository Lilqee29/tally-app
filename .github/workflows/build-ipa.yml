name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (iOS, clean)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -workspace ios/tallyapp.xcworkspace \
            -scheme tallyapp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/tallyapp.app Payload/
          zip -r tally.ipa Payload/
          echo "IPA packaged successfully"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tally-ipa
          path: tally.ipa
          retention-days: 14
