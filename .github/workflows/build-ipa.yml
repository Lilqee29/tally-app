name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (iOS, clean)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned IPA
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | grep -A 5 '"schemes"' | grep -v 'schemes' | head -n 1 | tr -d ' ",' | xargs)
          echo "Using workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle at $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r tally.ipa Payload/
          echo "IPA packaged successfully"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tally-ipa
          path: tally.ipa
          retention-days: 14
